<!DOCTYPE html>
<html>
<head>
    <title>Página para aprendizaje</title>
<style>
    /* Animación principal */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Aplicar animación con un ligero retraso entre elementos para un mejor efecto */
    h1, h2, marquee, .multimedia {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    /* Estilo rápido para alinear tus elementos multimedia */
    .multimedia {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
