<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto de Emprendimiento</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --primary-color: #ff6b4a;
            --text-color: #2d3748;
            --subtext-color: #718096;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .image-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 28px;
            cursor: pointer;
            user-select: none;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Efecto de deslizamiento a la derecha al presionar/tocar */
        .image-wrapper:active img {
            transform: translateX(40px);
        }

        .btn-next {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(255, 107, 74, 0.3);
        }

        .btn-next:hover {
            background-color: #e05536;
        }

        .btn-next:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Generador de recetas</h1>
        
        <div class="image-wrapper">
            <img src="imagen.png" alt="Imagen desde mi PC">
        </div>

        <p>
            <a href="index2.html" class="btn-next">Siguiente</a>
        </p>
    </main>

    <script src="app.js"></script>
</body>
</html>
